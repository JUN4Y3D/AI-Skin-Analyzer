[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-skin-analyzer"
version = "0.1.0"
description = "Privacy-conscious skin image research infrastructure"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==1.26.4", "Pillow>=10.4,<14"]

[project.optional-dependencies]
ml = ["tensorflow==2.16.2", "keras==3.3.3"]
app = ["opencv-python-headless==4.10.0.84"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["skin_analyzer*", "app*"]
namespaces = false

[tool.setuptools.package-data]
app = ["templates/*.html", "static/css/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
